[project]
name = "experiment-observatory"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.scripts]
obs = "observatory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
observatory = ["static/*"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
